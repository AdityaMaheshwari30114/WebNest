<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WEBNEST Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">WEBNEST Admin</span>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-2 sidebar p-3">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="#clients">Clients</a></li>
                <li class="nav-item"><a class="nav-link" href="#contacts">Contact Forms</a></li>
                <li class="nav-item"><a class="nav-link" href="#subscribers">Subscribers</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="col-md-10 p-4">

            <!-- Projects -->
            <section id="projects" class="mb-5">
                <h3>Add Project</h3>
                <form class="card p-3">
                    <input type="file" class="form-control mb-2">
                    <input type="text" class="form-control mb-2" placeholder="Project Name">
                    <textarea class="form-control mb-2" placeholder="Project Description"></textarea>
                    <button class="btn btn-primary">Add Project</button>
                </form>
            </section>

            <!-- Clients -->
            <section id="clients" class="mb-5">
                <h3>Add Client</h3>
                <form class="card p-3">
                    <input type="file" class="form-control mb-2">
                    <input type="text" class="form-control mb-2" placeholder="Client Name">
                    <textarea class="form-control mb-2" placeholder="Client Description"></textarea>
                    <input type="text" class="form-control mb-2" placeholder="Designation">
                    <button class="btn btn-success">Add Client</button>
                </form>
            </section>

            <!-- Contact Form Data -->
            <section id="contacts" class="mb-5">
                <h3>Contact Form Submissions</h3>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>City</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Rahul Sharma</td>
                            <td>rahul@email.com</td>
                            <td>9876543210</td>
                            <td>Mumbai</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <!-- Subscribers -->
            <section id="subscribers">
                <h3>Newsletter Subscribers</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Email Address</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>user@example.com</td>
                        </tr>
                    </tbody>
                </table>
            </section>

        </main>
    </div>
</div>

</body>
</html>
